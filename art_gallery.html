  <style>
    @keyframes zoomIn {

    figure {

      box-shadow: 0 2px 8px rgba(0,0,0,0.25); margin: 24px; background-size: cover;}
    .TgalleryItem:hover {
      transform: scale(1.07); box-shadow: 0 8px 18px rgba(0,0,0,0.5);}

  <script>
    function openModal(modalId) {
      let modal = document.getElementById(modalId);
      modal.style.display = "flex";
      modal.classList.add("show");
    }

    function closeModal(modalId) {
      let modal = document.getElementById(modalId);
      modal.classList.remove("show");
      setTimeout(function () {
      modal.style.display = "none";
      }, 300);
    }
  </script>
