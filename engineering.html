<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio | Engineering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
  
<body>
  <div class="wrap">

    <!-- ----- NAVIGATION BAR ----- -->
    <nav>
      <ul class="nav">
        <li><a href="index.html">Home</a></li>
        <li><a href="engineering.html"><strong>Engineering</strong></a></li>
        <li><a href="art_gallery.html">Art Gallery</a></li>
        <li><a href="culinary.html">Culinary</a></li>
        <!-- <li><a href="inspiration.html">Inspiration</a></li> -->
      </ul>
    </nav>

    <!-- ---- GRID OF ORIGINAL EXPANDABLE TILES --- -->
    <div class="grid">
      <div class="dropDownTile" style="background-image: url('/photos/bugCoverTile.jpg');" onclick="toggleTile('bugTile')">
        <div class="dropDown-title">Fringe Racing: Buggy<br><span>Carbon-fiber Vehicle Racing</span></div>
      </div>
      <div class="dropDownTile" style="background-image: url('/photos/lunCoverTile.JPG');" onclick="toggleTile('lunTile')">
        <div class="dropDown-title">NASA Lunabotics<br><span>Lunar Excavation Rover</span></div>
      </div>
      <div class="dropDownTile" style="background-image: url('/photos/.jpg');" onclick="toggleTile('machTile')">
        <div class="dropDown-title">Machining<br><span>in the Workshop</span></div>
      </div>
      <div class="dropDownTile" style="background-image: url('/photos/.jpg');" onclick="toggleTile('acaTile')">
        <div class="dropDown-title">Academics<br><span>Resume &amp Relevant Coursework</span></div>
      </div>

      <!-- ---- EXPANDED BUGGY TILE ----- -->
      <div class="dropped" id="bugTile" style="display:none">
          this is the bug tile <br>
          <img src="/photos/bug1.JPEG" alt="bug photo 1" style="width: 300px">
      </div>

      <!-- ---- EXPANDED LUNABOTICS TILE -- -->
      <div class="dropped" id="lunTile" style="display:none">
          lunabotics tile
      </div>

      <!-- ---- EXPANDED MACHINING TILE -- --->
      <div class="dropped" id="machTile" style="display:none">
          machining tile
      </div>

      <!-- --- EXPANDED ACADEMIC TILE ---->
      <div class="dropped" id="acaTile" style="display:none">
          academic tile
          <object class="pdf" data="resume.pdf"> </object>
      </div> 
    </div>

    <!----- FUNCTION TO OPEN/CLOSE THE TILE EXPANSIONS -->
    <script>
      function toggleTile(tileID) {
        let x = document.getElementById(tileID);
        if (x.style.display === "none"){
          x.style.display = "block";
        } else {
          x.style.display = "none"; }}
    </script>
    
  </div>
</body>
