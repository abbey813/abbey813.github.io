<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio | Art Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    img{
      width:100%; max-width:600px;}
    .gallery {
      display: flex; flex-wrap: wrap; justify-content: flex-start; padding: 0 15px; }
    .gallery-item {
      position: relative; width: calc(25% - 20px); height: auto;
      margin: 10px; cursor: pointer; transition: transform 0.5s ease; }
    .gallery-item:hover {
      transform: scale(1.1); }
    /* The Modal (background) */
    .modal {
      display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.8); align-items: center; justify-content: center; transition: opacity 0.5s ease; }
    /* Modal content (image) */
    .modal-content {
      position: relative; width: 90%; height: auto; max-width: 90%; max-height: 90%; 
      border-radius: 5px; overflow: hidden; animation: zoomIn 0.5s; }
    @keyframes zoomIn {
      from {transform: scale(0.6);}
      to {transform: scale(1);} }
    .modal.show {
      display: flex; opacity: 1; }
    /* Close button */
    .close {
      position: absolute; top: 10px; right: 15px; color: #ffffff;
      font-size: 35px; font-weight: bold; cursor: pointer; transition: transform 0.3s; }
    @media screen and (max-width: 768px) {
      .gallery-item {
        width: calc(50% - 20px);
      } }
    @media screen and (max-width: 480px) {
      .gallery-item {
        width: calc(100% - 20px);
      } }
  </style>
</head>
  
<body>
  <div class="wrap">

  </div>


  <div class="gallery">
    <img src="/photos/art/jGeilsBand.jpg" alt="Centerfold, The J. Geils Band" class="gallery-item" onclick="openModal('modal1')">
    <img src="/photos/art/moboPresentsSetup.jpg" alt="MOBO Presents, Modern Baseball" class="gallery-item" onclick="openModal('modal2')">
    <img src="/photos/art/nowNotYet.heic" alt="Now Not Yet, half-alive" class="gallery-item" onclick="openModal('modal3')">
    <img src="/photos/art/citrona.heic" alt="Citrona, flipturn" class="gallery-item" onclick="openModal('modal4')">
  </div>

  <div id="modal1" class="modal">
    <span class="close" onclick="closeModal('modal1')">&times;</span>
    <img src="/photos/art/jGeilsBand.jpg" alt="Centerfold, The J. Geils Band" class="modal-content">
  </div>
  <div id="modal2" class="modal">
    <span class="close" onclick="closeModal('modal2')">&times;</span>
    <img src="/photos/art/moboPresentsSetup.jpg" alt="MOBO Presents, Modern Baseball" class="modal-content">
  </div>
  <div id="modal3" class="modal">
    <span class="close" onclick="closeModal('modal3')">&times;</span>
    <img src="/photos/art/nowNotYet.jpg" alt="Now Not Yet, half-alive" class="modal-content">
  </div>
  <div id="modal4" class="modal">
    <span class="close" onclick="closeModal('modal4')">&times;</span>
    <img src="/photos/art/citrona.jpg" alt="Citrona, flipturn" class="modal-content">
  </div>

  <script>
    function openModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.style.display = "flex";
    modal.classList.add("show");
    }

    function closeModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.classList.remove("show");
    setTimeout(function () {
    modal.style.display = "none";
    }, 300);
  }
  </script>
  
</body>
</html>
