  <style>
    .gallery {
      display: flex; flex-wrap: wrap; justify-content: flex-start; padding: 0 15px; }
    .gallery-item {
      position: relative; max-width: 400px; max-height: 300px; height: auto; width: auto;
      margin: 24px; cursor: pointer; transition: transform 0.2s ease; }
    .gallery-item:hover {
      transform: scale(1.07); }
    .gallery-item-title {
      position: absolute; left: 0; right: 0; bottom: 0; font-size: 1.0rem; padding: 0;
      margin: 24px 0 0; background: rgba(0, 0, 0, 0.4); color: white; line-height: 1.1; }
    .modal {
      display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.8); align-items: center; justify-content: center; transition: opacity 0.5s ease; }
    .modal-content {
      position: relative; width: auto; height: 100%; max-width: 100%; max-height: 100%; 
      border-radius: 5px; overflow: hidden; animation: zoomIn 0.5s; }
    @keyframes zoomIn {
      from {transform: scale(0.6);}
      to {transform: scale(1);} }
    .modal.show {
      display: flex; opacity: 1; }
    .close {
      position: absolute; top: 10px; right: 15px; color: #ffffff;
      font-size: 35px; font-weight: bold; cursor: pointer; transition: transform 0.3s; }
    @media screen and (max-width: 768px) {
      .gallery-item {
        width: calc(50% - 20px);
      } }
    @media screen and (max-width: 480px) {
      .gallery-item {
        width: calc(100% - 20px);
      } }
    .caption {
      display: block; background: white; color: black; padding: 2px; }
  </style>
</head>

  <script>
    function openModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.style.display = "flex";
    modal.classList.add("show");
    }

    function closeModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.classList.remove("show");
    setTimeout(function () {
    modal.style.display = "none";
    }, 300);
  }
  </script>
